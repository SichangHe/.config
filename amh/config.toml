# Settings of amh that are the same on every machine; committed.
# Machine-local settings (where the work logs are, addresses, passwords) live in env.toml under the state folder.

[human]
transport = "zulip"
# 🧑 "Make Codex use Sol low by default now and allow directly messaging the human"
writers = "claude,codex"

# 🧑 (via the manager) "Pin the allowlist by task file, not session, so restarts don't break it"
[human.writer_tasks]
terra_trial = "codex:gpt-6.1-terra"
dw_paper_prune = "codex:gpt-6-sol"

[manager]
# 🧑 "Allow Astra to message me, and shift management work from Claude to it" (Oct 24)
tools = "claude,codex"

[zulip]
# each machine names its own bot login in its env.toml (`zulip.env_file`); docs: agent_managers docs/machine-setup.md
# the main machine takes the human's messages, email, and jobs
main_bot = "a-bot@shagent.zulipchat.com"
human_id = 1212497
stream_id = 642517
# 🧑 "I said I don't want it to go though SSH, but use Zulip": agents on other machines post here, topic = receiving task
agent_stream = "amh-agents"

# The model and effort each tool starts with. `manager_model` and `manager_effort` apply to managers when set.
[launch.claude]
model = "claude-opus-5-5"
effort = "low"

[launch.codex]
# 🧑 "Make Codex use Sol low by default now and allow directly messaging the human"
model = "gpt-6.1-sol"
effort = "low"
manager_model = "gpt-6.1-sol"
manager_effort = "low"

[launch.cursor]
model = "grok-4.7"
effort = "high"

[launch.antigravity]
model = "gemini-3.8-flash-high"
effort = "high"

# Who compresses the human's mailbox, and when: more than unread_over unread agent emails (hourly), at once at unread_urgent.
[compress]
task = "human_mgr.md"
unread_over = 16
unread_urgent = 30

# Seconds between reminders to an idle agent that has open items; default 1800. Codex workers stop after each small step, so they are reminded sooner.
[remind]
codex_idle_s = 300
claude_idle_s = 14400

# Reloaded incoming notification routes; specific rules precede the general inbox dispatcher.
# 🧑 "All GH emails should be handled by agents"; unowned GitHub mail goes to mail_route_infra.md (asked by human_mgr.md)
# 🧑 "There is a \"This Week in Rust\" email in my mailbox, which should have been automatically dispatched to pb agents to be converted to pb news as applicable and marked read"
[mail_route.pb_twir]
from = "twir@rust-lang.org"
to = "stock_news_watch.md"
disposition = "read"

# 🧑 daily literature review, one paper per day; wakes its worker each morning.
# Off since Oct 15 by decision of vl_catchup.md: automated Scholar searches stopped after three blocks in four days.
# [job.vl_lit_review_daily]
# at = "09:00"
# tell = "vl_lit_review"
# text = "Daily wake: run today's normal Scholar search; stop at once on a captcha or block and tell your manager."

# 🧑 "I don't see CAPTCHA now. Don't be a pussy. I'll know when we get banned. We are not visiting hundreds of pages per minute" (2026-11-12); requested by vl_catchup.md.
[job.vl_paper_db_import_daily]
at = "09:00"
tell = "vl_paper_db_import"
text = "Run today's 09:00 daily Google Scholar search per docs/literature-collection.md, then report."

# Off since Oct 13 at the request of vl_catchup.md: the wider Scholar pass waits for a code review.
# [job.vl_lit_review_widened]
# at = "15:00"
# tell = "vl_lit_review"
# text = "Daily wake: if today's 09:00 search finished with no block, run the one small widened Scholar pass and log it in vlpw/widened_pass_log.md; otherwise skip it."
# 🧑 "GScholar is good for related work search. Make it work as a secondary thing. Solve the CAPTCHA consistently. Notify me to solve it when needed." (approved by the main manager, Oct 17)
[job.vl_paper_db_import_scholar]
at = "15:00"
tell = "vl_paper_db_import"
text = "Daily wake: run today's one secondary Scholar pass (run-related-work, per .runtime/secondary-scholar-handoff.md in VeruLaw tools/verus_paper_db), then export, commit and push; let the code handle any CAPTCHA."
# Reports of the workers of these tasks go to a file and do not wake the manager (asked by vl_catchup.md, Oct 13).
[report_sink]
vl_lit_dig = "/home/sichangheagent/.local/state/amh/report_sink_vl_lit_dig.md"
research_study_mgr = "/home/sichangheagent/.local/state/amh/report_sink_research_study_mgr.md"

# 🧑 "The PB news should be in its own channel. So is PB urgent."
[zulip.report_streams]
"pb news" = "pb-news"
"pb urgent" = "pb-urgent"
"pb digest" = "pb-digest"

# 🧑 "I want those threads to be monitored so that I can just directly reply back in those threads. To do certain tasks." (pb-digest, to pb_support)
# Report topics not listed here go to stock_news_watch.md.
[zulip.report_owners]
"pb digest" = "inbox_triage.md"

# 🧑 "All GH emails should be handled by agents"; owner named by human_mgr.md on 2026-11-09

# 🧑 "All GH emails should be handled by agents"; 🧑 "LGTM" (2026-11-09) to one GitHub route to a persistent router.
# owners: personal_browser_setup/docs/github_mail_routing.md
# 🧑 "Things I should answer should remain." (2026-11-19, via main manager): people's GitHub mail stays in the inbox; bot/CI mail is still trashed.
[mail_route.github]
from = "notifications@github.com"
to = "mail_route_infra.md"
priority = 100
disposition = "keep"

# 🤖 bot comments (e.g. "github-actions[bot] left a comment") need no answer
[mail_route.github_bot_comment]
from = "notifications@github.com"
body = "[bot] left a comment"
to = "mail_route_infra.md"
priority = 120
disposition = "trash"

# 🤖 CI failures of repos without a per-repo route
[mail_route.github_ci_unowned]
from = "notifications@github.com"
subject = "Run failed:"
to = "mail_route_infra.md"
priority = 110
disposition = "trash"


[mail_route.github_noreply]
from = "noreply@github.com"
to = "mail_route_infra.md"
priority = 100
disposition = "keep"

# 🤖 main_manager_agy.md: TeamTypeV CI failures go straight to tt_steer.md instead of being relayed by human_mgr.md
[mail_route.teamtypev_ci_failed]
mailbox = "human"
from = "notifications@github.com"
subject = "[SichangHe/TeamTypeV] Run failed:"
to = "tt_steer.md"
