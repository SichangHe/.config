# Settings of amh that are the same on every machine; committed.
# Machine-local settings (where the work logs are, addresses, passwords) live in env.toml under the state folder.

[human]
transport = "zulip"
writers = "claude,codex:astra"

[human.writer_sessions]
"3242dca4d7374d1ea54bdffa87420157" = "terra_trial:codex:gpt-6.1-terra"
1f23b2cf88054b02bbe4a9fcd70a0731 = "dw_paper_prune:codex:gpt-6-sol"

[manager]
# 🧑 "Allow Astra to message me, and shift management work from Claude to it" (Oct 24)
tools = "claude,codex"

[zulip]
env_file = "/home/sichangheagent/.config/amh/zulip.env"
human_id = 1212497
stream_id = 642517

# The model and effort each tool starts with. `manager_model` and `manager_effort` apply to managers when set.
[launch.claude]
model = "claude-opus-5-5"
effort = "low"

[launch.codex]
model = "gpt-6-astra"
effort = "low"
manager_model = "gpt-6-astra"
manager_effort = "high"

[launch.cursor]
model = "grok-4.7"
effort = "high"

[launch.antigravity]
model = "gemini-3.8-flash-high"
effort = "high"

# Who compresses the human's mailbox, and when: more than unread_over unread agent emails (hourly), at once at unread_urgent.
[compress]
task = "human_mgr.md"
unread_over = 16
unread_urgent = 30

# Seconds between reminders to an idle agent that has open items; default 1800. Codex workers stop after each small step, so they are reminded sooner.
[remind]
codex_idle_s = 300
claude_idle_s = 14400

# Reloaded incoming notification routes; specific rules precede the general inbox dispatcher.
[mail_route.gh_mac_ci]
from = "notifications@github.com"
