- This is a research idea that we can explore around and see whether we can do a research
  project on we should aim towards prestigious top conferences in computer science.
  And it is related to previous explorations around browser engine agent research.
  Basically we need to find research directions that are worth pursuing and can be
  published. I am thinking that since the memory prices have gone up a lot and it
  turns out memory has been the bottleneck for a lot of compute. Especially Web and
  JavaScript. Maybe there are ways to automatically reduce memory usage by statically
  analyzing the JavaScript programs or by letting agents convert existing programs
  into ones that use constructs that save memory. So the basic idea is JavaScript
  programs take a lot of memory because everything is separately keep allocated. We
  could reduce memory usage if we move some of that to stack allocation, either with
  JavaScript built-in functionalities or with WebAssembly. I'm not sure exactly how
  to do it though, and whether it has been done. Another direction as closely related
  is browser optimization. We need to understand why Chrome and Firefox use much more
  memory than Safari does. But that is probably a JavaScript engine and just in time
  compiler difference and beyond our scope. For both of these ideas and directions,
  search online using personal browser setup browsers broadly with different search
  keywords and search engines. Discuss with ChatGPT. Explore relevant papers using
  Google Scholar. And come back with a high-level report while preserving relevant
  papers and notes. Let a smartest agent do this and discuss with some smartest and
  adversarial subagents.
