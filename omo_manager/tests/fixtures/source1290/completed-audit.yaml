  \ codex\nmanagerat: wl:30\nis_manager: true\npending_task_items:\n  - This is a\
  \ research idea that we can explore around and see whether we can do a research\
  \ project on we should aim towards prestigious top conferences in computer science.\
  \ And it is related to previous explorations around browser engine agent research.\
  \ Basically we need to find research directions that are worth pursuing and can\
  \ be published. I am thinking that since the memory prices have gone up a lot and\
  \ it turns out memory has been the bottleneck for a lot of compute. Especially Web\
  \ and JavaScript. Maybe there are ways to automatically reduce memory usage by statically\
  \ analyzing the JavaScript programs or by letting agents convert existing programs\
  \ into ones that use constructs that save memory. So the basic idea is JavaScript\
  \ programs take a lot of memory because everything is separately keep allocated.\
  \ We could reduce memory usage if we move some of that to stack allocation, either\
  \ with JavaScript built-in functionalities or with WebAssembly. I'm not sure exactly\
  \ how to do it though, and whether it has been done. Another direction as closely\
  \ related is browser optimization. We need to understand why Chrome and Firefox\
  \ use much more memory than Safari does. But that is probably a JavaScript engine\
  \ and just in time compiler difference and beyond our scope. For both of these ideas\
  \ and directions, search online using personal browser setup browsers broadly with\
  \ different search keywords and search engines. Discuss with ChatGPT. Explore relevant\
  \ papers using Google Scholar. And come back with a high-level report while preserving\
  \ relevant papers and notes. Let a smartest agent do this and discuss with some\
  \ smartest and adversarial subagents.\n  - What does the rewrite do?\n  - What does\
  \ the current code do?\n  - What is the architecture on a high level?\n  - How do\
  \ we test it by moving some tasks onto this new control plane?\n  - Or do we have\
  \ to do a big bang migration and move everything on to it\n  - I have found some\
  \ other related projects should we try to pull the implementation details and overall\
  \ designs from them before we start using this one.\n  - You said something about\
  \ not knowing whether delivery happened. Shouldn\u2019t that be guaranteed by omni\
  \ agent?\n  - Own one disposition for both retired DW1 Common Crawl records from\
  \ BLOCKED_RECORD_DISPOSITIONS.md: choose a bounded rerun or explicit cancellation/terminal-failure\
  \ for the failed smoke, then resume or cancel dataset enlargement accordingly. Preserve\
  \ existing logs/artifacts, create no duplicate workers, and do not claim the failed\
  \ smoke succeeded.\n  - Add to an auxiliary manager document how to query the amount\
  \ of tokens left and let managers plan accordingly. Not sure exactly how, but start\
  \ with something.\n  - Reviewers did not like our approach on relying only on Binoculars.\
  \ That is why I am proposing to have three detectors. Try EVIL-Detect as well, if\
  \ it matches our overall requirements.\n  - We should still have DW going amidst\
  \ our token shortage. Tomorrow on August sixteenth, my research assistantship officially\
  \ resumes and I should be working on DW. Do not spend too much token too fast; have\
  \ one or two work happening in parallel at most.\n---\nCoordinate a publication-oriented\
  \ research-direction investigation.\n\n- Preserve the human's exact research goals\
  \ from the attached source email.\n- Delegate independent literature, browser/JavaScript\
  \ systems, and feasibility investigations to multiple strongest available workers.\n\
  - Require at least one adversarial worker to challenge novelty, scope, and top-conference\
  \ viability.\n- Require broad personal-browser web searches using varied terms and\
  \ search engines, Google Scholar paper exploration, and ChatGPT discussion as requested.\n\
  - Preserve relevant papers and compact notes outside the work-log repository.\n\
  - Synthesize a high-level report proposing concrete directions, prior art, novelty\
  \ gaps, feasibility, evaluation plans, risks, and plausible prestigious venues.\n\
