[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lifecycle-platform"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/lifecycle_platform"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
